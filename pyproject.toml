[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-viewer"
version = "1.1.0"
description = "Notepad-like Markdown viewer for Windows"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.5",
    "mistune>=3",
    "pygments>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[tool.setuptools]
packages = ["mdviewer", "mdviewer.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
